# Personal fork: build both web UIs + boot JAR, run JReleaser Docker package, push to GHCR.
# Requires: push this workflow to GitHub, enable Actions, use workflow_dispatch from Actions tab.
#
# Image tags:
#   ghcr.io/<owner>/komga:latest
#   ghcr.io/<owner>/komga:<komgaVersion>-mod.<forkBuild>
# where <komgaVersion> is version= from gradle.properties and <forkBuild> is the integer in fork.build.
# Bump fork.build when publishing another image for the same Komga version; reset to 1 after an upstream version sync.

name: Docker image (fork)

on:
  workflow_dispatch:

concurrency:
  group: docker-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: WebUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: WebUI - build
        working-directory: komga-webui
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: NextUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: NextUI - build
        working-directory: next-ui
        run: npm run build:with-i18n

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          java-package: jdk
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Set image tags
        id: ver
        run: |
          VER=$(grep '^version=' gradle.properties | cut -d= -f2)
          FORK_BUILD=$(grep -E '^[0-9]+$' fork.build | head -n1)
          if [ -z "$VER" ] || [ -z "$FORK_BUILD" ]; then
            echo "Could not read version from gradle.properties or fork.build" >&2
            exit 1
          fi
          TAG="${VER}-mod.${FORK_BUILD}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "fork_build=$FORK_BUILD" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Komga $VER (fork image tag: $TAG)"

      # JReleaser's Docker packager uses buildx multi-platform settings from build.gradle.kts.
      # Buildx (and QEMU for non-amd64) must exist *before* jreleaserPackage, not after.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application JAR
        run: ./gradlew :komga:webuiCopyIndex :komga:nextuiCopyIndex :komga:bootJar
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: JReleaser package (Docker context)
        run: ./gradlew jreleaserPackage
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug JReleaser Docker context
        run: |
          ls -la build/jreleaser/package || true
          ls -la build/jreleaser/package/komga || true
          ls -la build/jreleaser/package/komga/docker || true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # JReleaser package output is distribution-scoped under build/jreleaser/package/<distribution>/...
          context: ./build/jreleaser/package/komga/docker
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/komga:latest
            ghcr.io/${{ github.repository_owner }}/komga:${{ steps.ver.outputs.image_tag }}
